name: CPU validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ruff==0.16.8 bandit==1.8.6
      - name: Critical syntax and binding checks
        # F821 needs a reviewed baseline for inherited optional backend/type
        # imports. Do not suppress individual findings by rewriting those APIs.
        run: ruff check --select E9,F63,F7,F822,F823 src tests examples
      - name: Security lint
        run: bandit -r src/lava -q
  tests:
    name: CPU / ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install -r requirements/ci.txt -e .
      - name: CPU smoke example
        run: python examples/cpu_smoke.py
      - name: Test CPU suite (notebooks have a separate dependency contract)
        run: python -m pytest tests --ignore=tests/lava/tutorials --cov-report=term-missing --cov-report=xml --cov-fail-under=65
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: warn
