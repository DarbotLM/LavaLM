name: Package validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: lavalm-distributions
          path: dist/
          if-no-files-found: error
  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        format: [whl, tar.gz]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: lavalm-distributions
          path: dist
      - run: python -m pip install -c requirements/ci.txt dist/*.${{ matrix.format }}
      - name: Exercise installed artifact outside the checkout
        run: |
          cp examples/cpu_smoke.py "$RUNNER_TEMP/lavalm_cpu_smoke.py"
          cd "$RUNNER_TEMP"
          python lavalm_cpu_smoke.py
          python -c 'from importlib.metadata import metadata; assert metadata("lavalm")["Name"] == "lavalm"'
  # Publication is absent until registry ownership, credentials, version policy,
  # and a protected LavaLM release environment have been established.
